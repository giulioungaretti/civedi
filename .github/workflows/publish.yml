name: Publish Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify tag matches extension version
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "::error::Tag version $tag_version does not match package version $package_version."
            exit 1
          fi

      - name: Package extension
        run: npx --yes @vscode/vsce@3.9.2 package --out civedi.vsix

      - name: Publish extension
        run: npx --yes @vscode/vsce@3.9.2 publish --packagePath civedi.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
